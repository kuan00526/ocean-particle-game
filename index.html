  startP:'Where will the particle from the green start drift? Tap a spot you think it will pass (no score inside the dashed circle; try the FTLE map first).',
  land:'That is land. Please tap a spot at sea.',tooclose:'Too close to the start (no score within 150 km). Tap farther away.',drifting:'Particle drifting…',
  result:(p,km)=>`Match ${p}% (${km} km from the path) | Tap anywhere for the next one`}};
let lang='zh',curSay=null;
const tr=(k,...a)=>{const v=I18N[lang][k];return typeof v==='function'?v(...a):v};
function say(k,c,...a){curSay=[k,c,a];msgEl.textContent=tr(k,...a);msgEl.style.color=c||'#fff'}
function setMsg(t,c){msgEl.textContent=t;msgEl.style.color=c||'#fff'}

/* 落點預測選題：排除繞圈、太快碰壁/停滯、離起點太近的路徑（100km = gridSize/SPAN 像素） */
const HI_T=.75,HI_MAX=8;  // 高FTLE＝色階最高兩階（橘、紅）；整條路徑最多容許約 8 步落在其中（貼邊擦過）
function ftleHi(x,y){
  if(!ftleGrid)return false;
  const i=Math.floor((x-offX)/gridSize*RES),j=Math.floor((y-offY)/gridSize*RES);
  if(i<0||j<0||i>=RES||j>=RES)return false;
  const v=ftleGrid[j*RES+i];return v===v&&(v-ftleMin)/(ftleMax-ftleMin)>=HI_T;
}
function pathStats(sx,sy){
  let x=sx,y=sy,len=0,mx=0,lastMove=0,hi=0;const N=MAX_STEPS,u=gridSize/SPAN;
  for(let k=0;k<=N;k++){const q=mv(x,y),d=Math.hypot(q[0]-x,q[1]-y);len+=d;if(d>.15)lastMove=k;x=q[0];y=q[1];mx=Math.max(mx,Math.hypot(x-sx,y-sy));if(ftleHi(x,y))hi++}
  const net=Math.hypot(x-sx,y-sy),ok=mx>=3.5*u&&net>=2.5*u&&net>=.6*len&&lastMove>=.9*N;
  return {end:[x,y],net,ok,hi,clean:hi<=HI_MAX,score:(ok?1e6:0)+(hi<=HI_MAX?5e5:0)-hi*100+net};
}
function initLevel(){
  VM=1;MAX_STEPS=480;
  randomizeFlow();genFTLE();
  state='GUESSING';simP=[];simT=0;view='GAME';syncBtns();
  animT0=0;guess=null;pEnd=null;targetIndex=0;
  let best=null;
  for(let n=0;n<1500;n++){
    const sx=offX+nodeR+rnd()*(gridSize-nodeR*2),sy=offY+nodeR+rnd()*(gridSize-nodeR*2);
    if(!seaSafe(sx,sy,nodeR))continue;
    const m=pathStats(sx,sy);
    if(!best||m.score>best.score)best={sx,sy,end:m.end,score:m.score};
    if(m.ok&&m.clean)break;
  }
  if(!best){const sx=offX+gridSize/2,sy=offY+gridSize/2;best={sx,sy,end:simulate(sx,sy)}}
  targets=[[best.sx,best.sy]];finals=[best.end];pEnd=best.end;
  say('startP',null);
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a101a';ctx.fillRect(0,0,W,H);
  if(view==='FTLE'){
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(ftleCv,offX,offY,gridSize,gridSize);
    drawArrows(true);
    drawBar();
  }else{
    drawArrows(false);
  }
  drawLand();
  drawPredict();
  if(state==='ANIMATING'){
    if(!animT0)animT0=performance.now();const want=Math.floor((performance.now()-animT0)/3000*(MAX_STEPS+1)),multi=simP.length>1;  // 每2幀走一步：放慢並畫出軌跡
    ctx.lineJoin='round';
    for(const p of simP){
      if(!p.t)p.t=[[p[0],p[1]]];
      ctx.strokeStyle=multi?'rgba(255,60,230,.35)':'rgba(255,60,230,.95)';ctx.lineWidth=multi?1:3.5;
      ctx.beginPath();p.t.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
      ctx.fillStyle='rgba(255,60,230,1)';ctx.beginPath();ctx.arc(p[0],p[1],multi?3.5:5.5,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.2;ctx.stroke();
    }
    while(simT<want&&simT<=MAX_STEPS){for(const p of simP){[p[0],p[1]]=mv(p[0],p[1]);p.t.push([p[0],p[1]])}simT++;if(simT===MAX_STEPS+1)endMsg()}
  }
  requestAnimationFrame(draw);
}
function drawBar(){
  const bw=14,bh=gridSize*.65,bx=offX+gridSize+12,by=offY+(gridSize-bh)/2;
  for(let k=0;k<bh;k+=2){
    const c=ftleBand(1-k/bh);ctx.fillStyle=`rgb(${c})`;ctx.fillRect(bx,by+k,bw,2);
  }
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(ftleMax.toFixed(3),bx+bw+4,by);ctx.fillText(((ftleMin+ftleMax)/2).toFixed(3),bx+bw+4,by+bh/2);ctx.fillText(ftleMin.toFixed(3),bx+bw+4,by+bh);
}
function drawArrows(onFtle){
  const sp=gridSize/27;
  ctx.strokeStyle=onFtle?'rgba(0,0,0,.9)':'rgba(255,255,255,.4)';ctx.lineWidth=1.2;
  for(let x=offX+sp/2;x<offX+gridSize;x+=sp)for(let y=offY+sp/2;y<offY+gridSize;y+=sp){
    if(isLand(x,y))continue;
    const v=flow(x,y),len=Math.hypot(v[0],v[1])*sp*.24;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(v[1],v[0]));
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.moveTo(len-3.5,2.5);ctx.lineTo(len,0);ctx.lineTo(len-3.5,-2.5);ctx.stroke();
    ctx.restore();
  }
}
function drawPredict(){
  const s=targets[targetIndex];
  ctx.textAlign='center';ctx.textBaseline='middle';
  const mark=(p,col,t)=>{ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],nodeR*.42,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font=`bold ${nodeR*.5}px system-ui`;ctx.fillText(t,p[0],p[1]+1)};
  if(guess&&state==='ANIMATING'&&simT>MAX_STEPS){
    ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(guess[0],guess[1]);ctx.lineTo(nearPt[0],nearPt[1]);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(nearPt[0],nearPt[1],3,0,7);ctx.fill();
    mark(pEnd,'rgba(0,170,200,.95)',tr('mE'));
  }
  if(guess)mark(guess,'rgba(220,80,80,.95)',tr('mG'));
  if(state==='GUESSING'){ctx.setLineDash([5,5]);ctx.strokeStyle=view==='FTLE'?'rgba(0,0,0,.9)':'rgba(255,255,255,.45)';ctx.lineWidth=view==='FTLE'?2:1.5;ctx.beginPath();ctx.arc(s[0],s[1],1.5*gridSize/SPAN,0,7);ctx.stroke();ctx.setLineDash([])}
  mark(s,'rgba(40,160,80,.95)',tr('mS'));
}
function endMsg(){
  if(!guess)return;
  const km=Math.round(Math.hypot(guess[0]-nearPt[0],guess[1]-nearPt[1])/gridSize*SPAN*100);
  say('result',lastPct>=70?'#7dff9b':lastPct>=40?'#ffe08a':'#ff8a8a',lastPct,km);
}
function pick(x,y){
  if(state==='ANIMATING'){if(simT>MAX_STEPS)initLevel();return}
  {
    if(x<offX||x>offX+gridSize||y<offY||y>offY+gridSize)return;
    if(isLand(x,y)){say('land','#ff8a8a');return}
    {const s1=targets[targetIndex];if(Math.hypot(x-s1[0],y-s1[1])<1.5*gridSize/SPAN){say('tooclose','#ff8a8a');return}}
    guess=[x,y];
    {const s0=targets[targetIndex];let a=[s0[0],s0[1]];pathPts=[a];for(let k=0;k<=MAX_STEPS;k++){a=mv(a[0],a[1]);pathPts.push(a)}}
    let d=1e9;nearPt=pathPts[0];  // 與整條漂流路徑（線段）的最近距離
    for(let k=1;k<pathPts.length;k++){const A=pathPts[k-1],B=pathPts[k],dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy;let t=L2?((x-A[0])*dx+(y-A[1])*dy)/L2:0;t=Math.max(0,Math.min(1,t));const qx=A[0]+t*dx,qy=A[1]+t*dy,dd=Math.hypot(x-qx,y-qy);if(dd<d){d=dd;nearPt=[qx,qy]}}
    const dkm=d/gridSize*SPAN*100;lastPct=Math.round((P=>{for(let i=1;i<P.length;i++)if(dkm<=P[i][0])return P[i-1][1]+(P[i][1]-P[i-1][1])*(dkm-P[i-1][0])/(P[i][0]-P[i-1][0]);return 15})([[0,100],[15,95],[30,90],[100,85],[200,80],[700,30],[1500,15]]));  // 分段線性：距離km→符合度%
    state='ANIMATING';simT=0;view='GAME';syncBtns();
    const s=targets[targetIndex];simP=[[s[0],s[1]]];say('drifting');return;
  }
}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();pick(e.clientX-r.left,e.clientY-r.top)});

const bG=document.getElementById('bGame'),bF=document.getElementById('bFtle');
function syncBtns(){bG.classList.toggle('on',view==='GAME');bF.classList.toggle('on',view==='FTLE')}
bG.onclick=()=>{view='GAME';syncBtns()};
bF.onclick=()=>{view='FTLE';syncBtns()};
const bL=document.getElementById('bLang'),bN=document.getElementById('bNew');
bN.onclick=()=>initLevel();
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=tr('title');
  bG.textContent=tr('game');bF.textContent=tr('ftle');bN.textContent=tr('newL');bL.textContent=tr('langBtn');syncBtns();
  if(curSay)say(curSay[0],curSay[1],...curSay[2]);
}
bL.onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang()};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();initLevel()},250)});
layout();initLevel();draw();
</script>
</body>
</html>
